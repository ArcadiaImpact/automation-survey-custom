<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Measuring Automation in AI Safety Research — Arcadia Impact</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAF9;        /* site body off-white */
  --ink:#24332C;       /* emerald, text + buttons */
  --mid:#566059;       /* neutral grey-green for hints */
  --line:#E2E4E1;      /* hairline borders */
  --soft:#ECEEEC;      /* mist */
  --card:#FFFFFF;
  --warn:#F7E198;      /* highlight yellow, sparingly */
  --ok:#425F48;        /* forest, small accents only */
  --danger:#8C3B21;
  box-sizing:border-box;
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Cabin',-apple-system,'Segoe UI',sans-serif;
  font-size:16.5px; line-height:1.55;
}
h1,h2,h3{font-family:'Source Serif 4',Georgia,serif; line-height:1.18; margin:0 0 .35em}
h1{font-size:2.1rem; font-weight:600; letter-spacing:-.01em}
h2{font-size:1.45rem; font-weight:600}
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  background:#24332C; color:#FAFAF9;
  padding:calc(.85rem + env(safe-area-inset-top,0px)) 1.4rem .85rem;
}
.topbar .mark{font-family:'Source Serif 4',Georgia,serif; font-size:1.15rem; font-weight:600; letter-spacing:.01em; color:inherit; text-decoration:none}
.topbar .mark:hover,.topbar .mark:focus-visible{text-decoration:underline; text-underline-offset:.2em}
.topbar .mock{font-size:.75rem; border:1px solid rgba(250,250,249,.45); border-radius:999px; padding:.15rem .65rem; white-space:nowrap}
.wrap{max-width:780px; margin:0 auto; padding:2.4rem 1.2rem 4rem}
.lede{font-size:1.05rem; max-width:62ch}
.lede p{margin:.6em 0}
/* progress */
.progress{display:flex; align-items:center; gap:.8rem; margin:0 0 1.8rem}
.ptrack{flex:1; height:4px; background:var(--soft); border-radius:3px; overflow:hidden}
.pfill{height:100%; width:0%; background:var(--ink); transition:width .25s ease}
.pstep{font-size:.85rem; color:var(--mid); white-space:nowrap}
@media (prefers-reduced-motion: reduce){ .pfill{transition:none} }
/* fields */
.step{display:none}
.step.active{display:block}
fieldset{border:0; padding:0; margin:0 0 1.6rem}
label.q, legend.q{display:block; font-weight:600; margin-bottom:.4rem}
.req::after{content:" *"; color:var(--ok); font-weight:700}
.hint{font-size:.9rem; color:var(--mid); margin:-.2rem 0 .55rem; max-width:62ch}
.hint.contact{margin:1.6rem 0 0}
.instruction-lead{font-weight:600; margin:1.2rem 0 .35rem}
.instructions{margin:.35rem 0 1rem; padding-left:1.5rem; max-width:62ch}
.instructions li{margin:.45rem 0; padding-left:.2rem}
input[type=text],input[type=email],input[type=number],textarea{
  width:100%; max-width:34rem; padding:.55rem .7rem;
  font:inherit; color:var(--ink); background:var(--card);
  border:1px solid var(--line); border-radius:8px;
}
textarea{max-width:100%; min-height:6.2rem; resize:vertical}
input:focus-visible,textarea:focus-visible,button:focus-visible,.choice:focus-within{
  outline:2px solid var(--ok); outline-offset:2px;
}
.choices{display:flex; flex-wrap:wrap; gap:.5rem}
.choice{
  display:flex; align-items:center; gap:.45rem;
  border:1px solid var(--line); background:var(--soft);
  border-radius:999px; padding:.42rem .9rem; cursor:pointer; font-size:.92rem;
}
.choice:hover{border-color:#C9CDC9}
.choice input{accent-color:var(--ink); margin:0}
.choice:has(input:checked){background:var(--ink); border-color:var(--ink); color:#FAFAF9}
.otherline{display:flex; gap:.5rem; align-items:center; margin-top:.55rem}
.otherline input[type=text]{max-width:16rem}
/* tables */
.tablecard{background:var(--card); border:1px solid var(--line); border-radius:12px; padding:0; overflow-x:auto; margin:.4rem 0 1rem; box-shadow:0 1px 3px rgba(36,51,44,.06)}
table{border-collapse:collapse; width:100%; min-width:560px}
th,td{padding:.6rem .7rem; text-align:left; border-bottom:1px solid var(--soft); font-size:.95rem}
thead th{background:var(--soft); font-weight:600; position:sticky; top:0}
thead th:not(:first-child){text-align:center; width:7.4rem; min-width:6.4rem; line-height:1.3; vertical-align:middle}
.info-tip{display:inline-block; position:relative; margin-left:.25rem; vertical-align:middle}
.info-tip summary{
  display:inline-grid; place-items:center; width:1.15rem; height:1.15rem;
  border:1px solid var(--mid); border-radius:50%; color:var(--mid);
  font-size:.72rem; line-height:1; cursor:pointer; list-style:none;
}
.info-tip summary::-webkit-details-marker{display:none}
.info-tip summary:focus-visible{outline:2px solid var(--ok); outline-offset:2px}
.tip-text{
  visibility:hidden; opacity:0; position:absolute; z-index:5;
  top:calc(100% + .5rem); left:50%; transform:translateX(-50%);
  width:min(24rem,75vw); padding:.65rem .75rem; border-radius:8px;
  background:var(--ink); color:#FAFAF9; font-size:.8rem;
  font-weight:400; line-height:1.4; text-align:left;
  box-shadow:0 4px 14px rgba(36,51,44,.2);
}
.tip-list{margin:0; padding-left:1.1rem}
.tip-list li+li{margin-top:.45rem}
.info-tip:hover .tip-text,.info-tip:focus-within .tip-text,.info-tip[open] .tip-text{visibility:visible; opacity:1}
tbody td:not(.taskname){text-align:center}
tbody tr:last-child td{border-bottom:0}
td.taskname{font-weight:500; max-width:17rem}
td.taskname small{display:block; font-weight:400; color:var(--mid); font-size:.8rem; line-height:1.3}
.cell{width:5.4rem; padding:.4rem .5rem; text-align:center; font:inherit; color:var(--ink);
  background:var(--bg); border:1px solid #D8DBD8; border-radius:6px}
.cell:disabled{background:var(--soft); color:transparent}
input.cell::-webkit-outer-spin-button, input.cell::-webkit-inner-spin-button{-webkit-appearance:none; margin:0}
input.cell{-moz-appearance:textfield; appearance:textfield}
/* sum bar */
.sumbar{
  display:flex; align-items:center; justify-content:space-between; gap:1rem;
  border:1px solid var(--line); border-radius:12px; padding:.7rem 1rem; margin:.2rem 0 1.2rem;
  background:var(--card); box-shadow:0 1px 3px rgba(36,51,44,.06);
}
.sumbar .label{font-weight:600}
.sumbar .tag{display:inline-block; margin-top:.15rem; background:var(--warn); color:#24332C;
  border-radius:999px; padding:.08rem .6rem; font-size:.8rem; font-weight:500}
.sumbar.ok .tag{background:transparent; border:1px solid var(--ok); color:var(--ok)}
.sumbar .big{font-family:'Source Serif 4',Georgia,serif; font-size:1.6rem; font-weight:700}
/* nav */
.nav{display:flex; justify-content:space-between; gap:1rem; margin-top:2rem}
button{
  font:inherit; font-weight:600; cursor:pointer; border-radius:10px;
  padding:.68rem 1.3rem; font-size:.82rem; letter-spacing:.05em; text-transform:uppercase;
}
.next{background:var(--ink); color:#FAFAF9; border:1px solid var(--ink)}
.next::before{content:"⇢  "}
.next:disabled{opacity:.4; cursor:not-allowed}
.back{background:var(--card); color:var(--ink); border:1px solid #C9CDC9}
.back[hidden]{visibility:hidden; display:block}
.progress[hidden],.otherline[hidden]{display:none}
.save-status{font-size:.8rem; color:var(--mid); white-space:nowrap}
.website-field{
  position:absolute; left:-10000px; width:1px; height:1px; overflow:hidden;
}
.error{color:var(--danger); font-size:.9rem; min-height:1.2rem; margin-top:.8rem}
/* review modal */
dialog{
  border:1px solid var(--line); border-radius:14px; background:var(--card); color:var(--ink);
  max-width:40rem; width:92%; padding:1.4rem 1.5rem;
}
dialog::backdrop{background:rgba(36,51,44,.5)}
pre{background:var(--soft); border-radius:8px; padding:.9rem; overflow:auto; font-size:.78rem; max-height:40vh}
.badge{display:inline-block; background:var(--warn); color:#24332C; border-radius:6px; padding:.1rem .5rem; font-size:.8rem; font-weight:600}
footer{margin-top:3.5rem; font-size:.82rem; color:var(--mid)}
</style>
</head>
<body>
<header class="topbar">
  <a class="mark" id="brand" target="_blank" rel="noopener noreferrer"></a>
  <span class="mock" id="mockBadge" hidden></span>
</header>
<div class="wrap">
  <div class="progress" id="progress" hidden>
    <div class="ptrack"><div class="pfill" id="pfill"></div></div>
    <span class="pstep" id="pstep"></span>
    <span id="saveStatus" class="save-status" role="status" aria-live="polite"></span>
  </div>

  <section class="step active" data-step="0">
    <h1 id="introTitle"></h1>
    <div class="lede" id="introParas"></div>
    <div class="nav">
      <button class="back" hidden>Back</button>
      <button class="next" id="startBtn" onclick="startSurvey()"></button>
    </div>
  </section>

  <section class="step" data-step="1">
    <h2 id="aboutTitle"></h2>
    <div id="aboutPre"></div>
    <fieldset>
      <label class="q" for="email" id="emailLabel"></label>
      <p class="hint" id="emailHint"></p>
      <input type="email" id="email" autocomplete="email" maxlength="200">
    </fieldset>
    <fieldset>
      <legend class="q req" id="jobTitleLabel"></legend>
      <div class="choices" id="jobTitle"></div>
      <div class="otherline" id="jobTitleOtherLine" hidden>
        <input type="text" id="jobTitleOther" aria-label="Other job title" maxlength="300">
      </div>
    </fieldset>
    <fieldset>
      <legend class="q req" id="roleTypeLabel"></legend>
      <div class="choices" id="roleType"></div>
      <div class="otherline" id="roleTypeOtherLine" hidden>
        <input type="text" id="roleTypeOther" aria-label="Other role type" maxlength="300">
      </div>
    </fieldset>
    <fieldset>
      <legend class="q req" id="expLabel"></legend>
      <div class="choices" id="exp"></div>
    </fieldset>
    <fieldset>
      <label class="q req" for="usage" id="usageLabel"></label>
      <p class="hint" id="usageHint"></p>
      <textarea id="usage" maxlength="4000" required></textarea>
    </fieldset>
    <p class="error" id="err1"></p>
    <div class="nav">
      <button class="back" data-nav="back" onclick="go(0)"></button>
      <button class="next" data-nav="next" onclick="validate1()"></button>
    </div>
  </section>

  <section class="step" data-step="2">
    <h2 id="pointsTitle"></h2>
    <div id="pointsPre"></div>
    <div class="tablecard">
      <table aria-label="Distribute 100 points across task categories">
        <thead><tr><th id="ptsColTask"></th><th style="width:7rem" id="ptsColPoints"></th></tr></thead>
        <tbody id="ptsBody"></tbody>
      </table>
    </div>
    <div class="sumbar" id="sumbar" role="status">
      <span><span class="label" id="totalLabel"></span><br><span class="tag" id="sumhint"></span></span>
      <span class="big" id="sumval">0</span>
    </div>
    <div class="nav">
      <button class="back" data-nav="back" onclick="go(1)"></button>
      <button class="next" data-nav="next" id="next2" onclick="completeStep(2,3)" disabled></button>
    </div>
  </section>

  <section class="step" data-step="3">
    <h2 id="hoursTitle"></h2>
    <div id="hoursPre"></div>
    <p class="instruction-lead" id="hoursInstructionLead"></p>
    <ol class="instructions" id="hoursInstructions"></ol>
    <div id="hoursReminders"></div>
    <div class="tablecard">
      <table aria-label="Active human hours per task and era">
        <thead><tr id="hoursHead"></tr></thead>
        <tbody id="hrsBody"></tbody>
      </table>
    </div>
    <fieldset>
      <label class="q" for="hoursNotes" id="hoursNotesLabel"></label>
      <p class="hint" id="hoursNotesHint"></p>
      <textarea id="hoursNotes" maxlength="4000"></textarea>
    </fieldset>
    <p class="error" id="err3"></p>
    <div class="nav">
      <button class="back" data-nav="back" onclick="go(2)"></button>
      <button class="next" data-nav="next" onclick="validate3()"></button>
    </div>
  </section>

  <section class="step" data-step="4">
    <h2 id="barriersTitle"></h2>
    <div id="barriersPre"></div>
    <fieldset>
      <label class="q req" for="highvalue" id="highvalueLabel"></label>
      <textarea id="highvalue" maxlength="4000" required></textarea>
    </fieldset>
    <fieldset>
      <label class="q req" for="reason" id="reasonLabel"></label>
      <p class="hint" id="reasonHint"></p>
      <textarea id="reason" maxlength="4000" required></textarea>
    </fieldset>
    <fieldset>
      <label class="q req" for="tracking" id="trackingLabel"></label>
      <textarea id="tracking" maxlength="4000" required></textarea>
    </fieldset>
    <p class="error" id="err4"></p>
    <div class="nav">
      <button class="back" data-nav="back" onclick="go(3)"></button>
      <button class="next" id="submitBtn" onclick="validate4()"></button>
    </div>
    <p class="hint contact" id="contactNote"></p>
  </section>

  <section class="step" data-step="5">
    <h1 id="thanksTitle"></h1>
    <div class="lede"><p id="thanksBody"></p></div>
  </section>

  <div class="website-field" aria-hidden="true">
    <label for="website">Website</label>
    <input id="website" type="text" tabindex="-1" autocomplete="off">
  </div>

  <footer id="footerText"></footer>
</div>

<dialog id="reviewDlg">
  <h2><span id="dlgTitle"></span> <span class="badge" id="dlgTag"></span></h2>
  <p id="dlgBody"></p>
  <pre id="payload"></pre>
  <div class="nav" style="margin-top:1rem">
    <button class="back" id="dlgClose" onclick="document.getElementById('reviewDlg').close()"></button>
  </div>
</dialog>

<script src="content.js"></script>
<script src="persistence.js"></script>
<script>
const C = window.CONTENT;
const P = window.SurveyPersistence;
const ERAS = ["noai","yr1","now","mo6"];
let step = 0;
const STEPS = 5;
const $ = id => document.getElementById(id);
const setText = (id, t) => { $(id).textContent = t; };

// ---------- hydrate static text ----------
document.title = C.pageTitle;
setText("brand", C.brand); $("brand").href = C.brandUrl;
const MOCK = !C.submit.endpoint;
if (MOCK) { $("mockBadge").hidden = false; setText("mockBadge", C.mock.badge); }
setText("thanksTitle", C.submit.thanksTitle); setText("thanksBody", C.submit.thanksBody);
$("contactNote").innerHTML = C.submit.contact;
setText("introTitle", C.intro.title);
C.intro.paragraphs.forEach(t => { const p = document.createElement("p"); p.innerHTML = t; $("introParas").appendChild(p); });
setText("startBtn", C.intro.startLabel);
setText("footerText", C.footer);
document.querySelectorAll('[data-nav="back"]').forEach(b => b.textContent = C.nav.back);
document.querySelectorAll('[data-nav="next"]').forEach(b => b.textContent = C.nav.next);
setText("submitBtn", C.nav.submit);
setText("dlgTitle", C.mock.dialogTitle); setText("dlgTag", C.mock.dialogTag);
setText("dlgBody", C.mock.dialogBody); setText("dlgClose", C.mock.closeLabel);

function preamble(containerId, paras){
  paras.forEach(t => { const p = document.createElement("p"); p.className = "hint"; p.innerHTML = t; $(containerId).appendChild(p); });
}
function radios(containerId, name, options, other){
  (options.concat(other ? ["__other"] : [])).forEach(v => {
    const lab = document.createElement("label"); lab.className = "choice";
    const text = (v === "__other") ? other.otherLabel : v;
    lab.innerHTML = `<input type="radio" name="${name}" value="${v.replace(/"/g,"&quot;")}">${text}`;
    $(containerId).appendChild(lab);
  });
}

// about
setText("aboutTitle", C.about.title); preamble("aboutPre", C.about.preamble);
setText("emailLabel", C.about.email.label); setText("emailHint", C.about.email.hint);
setText("jobTitleLabel", C.about.jobTitle.label); radios("jobTitle", "jobTitle", C.about.jobTitle.options, C.about.jobTitle);
$("jobTitleOther").placeholder = C.about.jobTitle.otherPlaceholder;
setText("roleTypeLabel", C.about.roleType.label); radios("roleType", "roleType", C.about.roleType.options, C.about.roleType);
$("roleTypeOther").placeholder = C.about.roleType.otherPlaceholder;
setText("expLabel", C.about.experience.label); radios("exp", "exp", C.about.experience.options, null);
setText("usageLabel", C.about.usage.label); setText("usageHint", C.about.usage.hint);

// points
setText("pointsTitle", C.points.title); preamble("pointsPre", C.points.preamble);
setText("ptsColTask", C.points.colTask); setText("ptsColPoints", C.points.colPoints);
setText("totalLabel", C.points.totalLabel); setText("sumhint", C.points.needHint);
C.tasks.forEach((t,i)=>{
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="taskname">${t.name}<small>${t.detail}</small></td>
    <td><input class="cell" type="number" min="0" max="100" step="1" inputmode="numeric" id="pts${i}" aria-label="Points for ${t.name}" oninput="sum()"></td>`;
  $("ptsBody").appendChild(tr);
});

// hours
setText("hoursTitle", C.hours.title); preamble("hoursPre", C.hours.preamble);
setText("hoursInstructionLead", C.hours.instructionLead);
C.hours.instructions.forEach(t=>{
  const li = document.createElement("li"); li.textContent = t; $("hoursInstructions").appendChild(li);
});
preamble("hoursReminders", C.hours.reminders);
$("hoursHead").innerHTML = `<th>${C.hours.colTask}</th>` + C.hours.eraHeaders.map((h,i)=>{
  const guide = C.hours.oneYearAgoGuide.map(t=>`<li>${t}</li>`).join("");
  const tip = i===1 ? `<details class="info-tip"><summary aria-label="Models and tools included one year ago">i</summary><span class="tip-text"><ul class="tip-list">${guide}</ul></span></details>` : "";
  return `<th>${h}${tip}</th>`;
}).join("");
C.tasks.forEach((t,i)=>{
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="taskname">${t.name}<small>${t.detail}</small></td>` + ERAS.map(e=>`<td><input class="cell" type="number" min="0" step="0.5" inputmode="decimal" id="${e}${i}" aria-label="${t.name}, hours" placeholder="${C.hours.cellPlaceholder}"></td>`).join("");
  $("hrsBody").appendChild(tr);
});
setText("hoursNotesLabel", C.hours.notes.label); setText("hoursNotesHint", C.hours.notes.hint);

// barriers
setText("barriersTitle", C.barriers.title); preamble("barriersPre", C.barriers.preamble);
setText("highvalueLabel", C.barriers.highvalue.label);
setText("reasonLabel", C.barriers.reason.label); setText("reasonHint", C.barriers.reason.hint);
setText("trackingLabel", C.barriers.tracking.label);

// ---------- behaviour ----------
function sum(){
  let s = 0, bad = false;
  C.tasks.forEach((_,i)=>{
    const el = $("pts"+i), v = Number(el.value || 0);
    if (el.validity.badInput || !(v >= 0 && v <= 100)) bad = true;
    s += v;
  });
  setText("sumval", s);
  const ok = (s === 100) && !bad;
  $("sumbar").classList.toggle("ok", ok);
  setText("sumhint", bad ? C.points.badCellHint : ok ? C.points.okHint : (s>100 ? (s-100)+C.points.overSuffix : (100-s)+C.points.toGoSuffix));
  $("next2").disabled = !ok;
}

function go(n){
  step = n;
  document.querySelectorAll(".step").forEach(s=>s.classList.toggle("active", Number(s.dataset.step)===n));
  $("progress").hidden = (n===0 || n>=STEPS);
  $("pfill").style.width = (n/(STEPS-1)*100)+"%";
  setText("pstep", "Step "+n+" of "+(STEPS-1));
  if(started) autosave.flush();
  window.scrollTo({top:0});
}

function completeStep(completed, next){
  draft.last_completed_step = Math.max(draft.last_completed_step, completed);
  saveDraft();
  go(next);
}

function validate1(){
  const L = C.validation.aboutLabels, missing = [];
  const jobTitle = document.querySelector('input[name="jobTitle"]:checked');
  if(!jobTitle || (jobTitle.value==="__other" && !$("jobTitleOther").value.trim())) missing.push(L.jobTitle);
  const roleType = document.querySelector('input[name="roleType"]:checked');
  if(!roleType || (roleType.value==="__other" && !$("roleTypeOther").value.trim())) missing.push(L.roleType);
  if(!document.querySelector('input[name="exp"]:checked')) missing.push(L.experience);
  if(!$("usage").value.trim()) missing.push(L.usage);
  if(missing.length){ setText("err1", C.validation.stillNeeded + missing.join(", ") + "."); return; }
  setText("err1",""); completeStep(1,2);
}

function validate3(){
  const missing = [], negative = [];
  C.tasks.forEach((t,i)=>{
    const rowIsBlank = ERAS.every(e=>$(e+i).value.trim()==="");
    if(rowIsBlank) return;
    if(ERAS.some(e=>$(e+i).value.trim()==="" || $(e+i).validity.badInput)) missing.push(t.name);
    else if(ERAS.some(e=>!(Number($(e+i).value) >= 0))) negative.push(t.name);
  });
  if(missing.length){ setText("err3", C.hours.errIncomplete + missing.join(", ") + "."); return; }
  if(negative.length){ setText("err3", C.submit.errNumbers + negative.join(", ") + "."); return; }
  setText("err3",""); completeStep(3,4);
}

function validate4(){
  const L = C.validation.barrierLabels;
  const missing = ["highvalue","reason","tracking"].filter(id=>!$(id).value.trim()).map(id=>L[id]);
  if(missing.length){ setText("err4", C.validation.stillNeeded + missing.join(", ") + "."); return; }
  draft.last_completed_step = Math.max(draft.last_completed_step, 4);
  setText("err4",""); submitResponse();
}

function toggleOther(name){
  const other = document.querySelector(`input[name="${name}"]:checked`)?.value==="__other";
  $(name+"OtherLine").hidden = !other;
}
$("jobTitle").addEventListener("change", ()=>toggleOther("jobTitle"));
$("roleType").addEventListener("change", ()=>toggleOther("roleType"));

function buildAnswers(includeEmail){
  const val = id => $(id).value.trim();
  const numberOrNull = id => val(id)==="" ? null : Number(val(id));
  const radio = n => document.querySelector(`input[name="${n}"]:checked`)?.value || null;
  const radioOrOther = n => radio(n)==="__other" ? val(n+"Other") : radio(n);
  const points = {}, hours = {};
  C.tasks.forEach((t,i)=>{
    points[t.id] = Number($("pts"+i).value||0);
    hours[t.id] = { without_ai: numberOrNull("noai"+i), one_year_ago: numberOrNull("yr1"+i),
                      now: numberOrNull("now"+i), in_6_months: numberOrNull("mo6"+i) };
  });
  const answers = {
    job_title: radioOrOther("jobTitle"),
    role_type: radioOrOther("roleType"), experience: radio("exp"),
    ai_usage: val("usage"), points, hours_active_human: hours, hours_notes: val("hoursNotes")||null,
    highest_value_to_automate: val("highvalue"), main_reason: val("reason"),
    agent_tracking: val("tracking")
  };
  if(includeEmail) answers.email = val("email")||null;
  return answers;
}

function buildSnapshot(status){
  return {
    response_id: draft.response_id,
    revision: draft.revision,
    status,
    last_completed_step: draft.last_completed_step,
    content_version: CONTENT_VERSION,
    client_updated_at: new Date().toISOString(),
    honeypot: $("website").value,
    answers: buildAnswers(status === "submitted")
  };
}

// Mock mode (no endpoint yet): just show the payload.
function review(){
  setText("payload", JSON.stringify(buildSnapshot("submitted"), null, 2));
  $("reviewDlg").showModal();
}

// ---------- drafts: answers survive a refresh or a closed tab ----------
function hashText(t){ let h = 2166136261; for (let i=0;i<t.length;i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return (h>>>0).toString(16).padStart(8,"0"); }
const CONTENT_VERSION = hashText(JSON.stringify(Object.assign({}, C, { submit: null })));
const DRAFT_KEY = "automation-survey-draft";
const newId = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 12);

let draft = {
  response_id: newId(),
  revision: 0,
  last_completed_step: 0,
  local_updated_at: Date.now(),
  fields: {},
  radios: {}
};
try {
  const saved = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
  if (saved && saved.response_id && !P.isDraftExpired(saved, Date.now())) {
    draft = saved;
    Object.entries(saved.fields || {}).forEach(([id, v]) => { const el = $(id); if (el) el.value = v; });
    Object.entries(saved.radios || {}).forEach(([name, v]) => {
      const el = document.querySelector(`input[name="${name}"][value="${CSS.escape(v)}"]`);
      if (el) el.checked = true;
    });
  } else if (saved) {
    localStorage.removeItem(DRAFT_KEY);
  }
} catch (e) { /* storage blocked (private mode etc.): the form still works, just without drafts */ }
toggleOther("jobTitle");
toggleOther("roleType");

let started = false;
const autosave = P.createAutosaveCoordinator({
  send: sendSnapshot,
  onState(state){
    const key = state === "saving" ? "saving"
      : state === "saved" ? "saved"
      : state === "failed" ? "saveFailed"
      : navigator.onLine ? "saveFailed" : "savedOffline";
    setText("saveStatus", C.submit[key]);
  },
  now: () => Date.now(),
  setTimer: (fn, ms) => setTimeout(fn, ms),
  clearTimer: id => clearTimeout(id),
  debounceMs: 3000,
  minIntervalMs: 120000, // background drafts go out at most every 2 minutes
  retryDelays: [2000, 5000, 15000]
});

function startSurvey(){
  started = true;
  saveDraft();
  go(1);
}

function queueDraftSave(){
  if(!started || MOCK) return;
  autosave.queue(P.draftEnvelope(buildSnapshot("draft")));
}

function saveDraft(){
  draft.revision = Number(draft.revision || 0) + 1;
  draft.last_completed_step = Number(draft.last_completed_step || 0);
  draft.local_updated_at = Date.now();
  draft.fields = {}; draft.radios = {};
  document.querySelectorAll(".wrap input[id], .wrap textarea[id]").forEach(el => { if (el.value) draft.fields[el.id] = el.value; });
  document.querySelectorAll(".wrap input[type=radio]:checked").forEach(el => { draft.radios[el.name] = el.value; });
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(draft)); } catch (e) {}
  queueDraftSave();
}
document.addEventListener("input", saveDraft);
document.addEventListener("change", saveDraft);
window.addEventListener("online", () => autosave.retry());
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden") autosave.flush();
});

// ---------- submit ----------
// Only show "thank you" once the script has confirmed the row was written.
// On any failure, keep everything on screen and let the person retry.
async function sendSnapshot(snapshot, signal){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 30000);
  // The coordinator aborts a background draft when Submit is pressed.
  if (signal) {
    if (signal.aborted) ctrl.abort();
    else signal.addEventListener("abort", () => ctrl.abort(), { once: true });
  }
  try {
    // text/plain keeps this a "simple" request, so the browser skips the
    // CORS preflight that Apps Script cannot answer.
    const res = await fetch(C.submit.endpoint, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(snapshot), signal: ctrl.signal
    });
    let out = null;
    try { out = await res.json(); } catch (e) { /* e.g. a Google login page instead of JSON */ }
    if(!out) throw new Error("unexpected reply from server (HTTP " + res.status + ", not JSON)");
    return out;
  } finally {
    clearTimeout(timer);
  }
}

let sending = false;
async function submitResponse(){
  if (MOCK) { saveDraft(); review(); return; }
  if (sending) return;
  sending = true;
  const btn = $("submitBtn");
  btn.disabled = true; setText("submitBtn", C.submit.sending); setText("err4", "");
  try {
    saveDraft();
    const out = await autosave.submit(buildSnapshot("submitted"));
    if(!out.ok || out.status !== "submitted"){
      throw new Error(out.message || "final response was not confirmed");
    }
    autosave.dispose();
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    go(5);
  } catch (err) {
    const network = err.name === "AbortError" || err instanceof TypeError;
    setText("err4", network ? C.submit.errNetwork : C.submit.errServer + err.message);
    setText("submitBtn", C.submit.retry);
  } finally {
    sending = false; btn.disabled = false;
  }
}
sum();
</script>
